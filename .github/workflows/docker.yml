name: Validate portable Hefesto & Astro SSG
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [cms-updated, hefesto-scaffolding-updated]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            portable/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          HEFESTO_API_URL: ${{ secrets.HEFESTO_API_URL }}
          PUBLIC_HEFESTO_API_URL: ${{ secrets.PUBLIC_HEFESTO_API_URL }}
      - run: npm test
      - run: npm ci --prefix portable
      - run: npm test --prefix portable
      - run: node --check portable/server.mjs
      - run: docker build -t hefesto:test .
