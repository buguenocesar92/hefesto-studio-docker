name: Validate portable Hefesto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portable/package-lock.json
      - run: npm ci --prefix portable
      - run: npm test --prefix portable
      - run: node --check portable/server.mjs
      - run: docker build -t hefesto:test .
