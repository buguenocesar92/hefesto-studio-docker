name: Validate portable Hefesto
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portable/package-lock.json
      - run: npm ci --prefix portable
      - run: npm test --prefix portable
      - run: node --check portable/server.mjs
      - run: docker build -t hefesto:test .
