services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-hefesto}
      POSTGRES_USER: ${PGUSER:-hefesto}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in the environment}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?Set APP_URL to the public domain}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN (>=32 chars)}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-hefesto}
      PGUSER: ${PGUSER:-hefesto}
      PGPASSWORD: ${PGPASSWORD}
      N8N_CHAT_URL: ${N8N_CHAT_URL:-}
      N8N_CHAT_TOKEN: ${N8N_CHAT_TOKEN:-}
      INVOICE_NINJA_URL: ${INVOICE_NINJA_URL:-}
      INVOICE_NINJA_TOKEN: ${INVOICE_NINJA_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
volumes:
  postgres:
