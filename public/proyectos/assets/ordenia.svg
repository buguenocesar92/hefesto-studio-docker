<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img"><title>ordenia — visualización ilustrativa con datos de ejemplo</title><rect x="0" y="0" width="1440" height="930" rx="20" fill="#f6f8f5" stroke="none"/><rect x="0" y="0" width="1440" height="56" rx="0" fill="#ffffff" stroke="none"/><circle cx="27" cy="28" r="5" fill="#ee7e6b"/><circle cx="48" cy="28" r="5" fill="#e2b85d"/><circle cx="69" cy="28" r="5" fill="#79b58e"/><text x="570" y="34" font-family="Arial,sans-serif" font-size="12" fill="#74897b" font-weight="400">VISTA ILUSTRATIVA · DATOS DE EJEMPLO</text><rect x="0" y="56" width="238" height="874" rx="0" fill="#ffffff" stroke="none"/><text x="27" y="115" font-family="Arial,sans-serif" font-size="25" fill="#283d39" font-weight="700">ordenia</text><text x="28" y="146" font-family="Arial,sans-serif" font-size="10" fill="#74897b" font-weight="400">TU ESPACIO MENTAL</text><rect x="16" y="187" width="205" height="43" rx="7" fill="#dfe7df" stroke="none"/><text x="34" y="215" font-family="Arial,sans-serif" font-size="15" fill="#283d39" font-weight="400">Mi resumen</text><text x="34" y="272" font-family="Arial,sans-serif" font-size="15" fill="#74897b" font-weight="400">Bandeja</text><text x="34" y="329" font-family="Arial,sans-serif" font-size="15" fill="#74897b" font-weight="400">Eventos</text><text x="34" y="386" font-family="Arial,sans-serif" font-size="15" fill="#74897b" font-weight="400">Tareas</text><text x="34" y="443" font-family="Arial,sans-serif" font-size="15" fill="#74897b" font-weight="400">Compras</text><text x="34" y="500" font-family="Arial,sans-serif" font-size="15" fill="#74897b" font-weight="400">Notas</text><rect x="22" y="733" width="195" height="135" rx="10" fill="#f6f8f5" stroke="none"/><text x="40" y="765" font-family="Arial,sans-serif" font-size="16" fill="#283d39" font-weight="600">Un mensaje.</text><text x="40" y="793" font-family="Arial,sans-serif" font-size="16" fill="#283d39" font-weight="600">Todo en orden.</text><text x="40" y="839" font-family="Arial,sans-serif" font-size="11" fill="#74897b" font-weight="400">Hecho con Hefesto</text><text x="282" y="117" font-family="Arial,sans-serif" font-size="31" fill="#283d39" font-weight="600">Dale espacio a lo que importa.</text><text x="282" y="152" font-family="Arial,sans-serif" font-size="16" fill="#74897b" font-weight="400">Ideas, pendientes y recuerdos, en un solo lugar.</text><rect x="280" y="192" width="1116" height="191" rx="12" fill="#ffffff" stroke="#dfe7df"/><text x="306" y="229" font-family="Arial,sans-serif" font-size="19" fill="#283d39" font-weight="600">¿Qué tienes en mente?</text><text x="306" y="276" font-family="Arial,sans-serif" font-size="18" fill="#74897b" font-weight="400">Hacer ejercicio mañana, comprar café y guardar una idea para mi proyecto…</text><rect x="1180" y="317" width="186" height="43" rx="7" fill="#2f7454" stroke="none"/><text x="1213" y="345" font-family="Arial,sans-serif" font-size="15" fill="white" font-weight="600">Organizar ↗</text><text x="307" y="347" font-family="Arial,sans-serif" font-size="12" fill="#74897b" font-weight="400">Clasificación por reglas · categorías personales</text><rect x="280" y="415" width="548" height="190" rx="12" fill="#ffffff" stroke="#dfe7df"/><text x="305" y="454" font-family="Arial,sans-serif" font-size="20" fill="#283d39" font-weight="600">Eventos</text><text x="305" y="506" font-family="Arial,sans-serif" font-size="17" fill="#283d39" font-weight="400">Consulta el jueves</text><rect x="305" y="528" width="236" height="28" rx="5" fill="#f6f8f5" stroke="none"/><text x="316" y="547" font-family="Arial,sans-serif" font-size="11" fill="#74897b" font-weight="400">Salud / Citas</text><text x="305" y="583" font-family="Arial,sans-serif" font-size="12" fill="#2f7454" font-weight="400">Ver eventos →</text><rect x="848" y="415" width="548" height="190" rx="12" fill="#ffffff" stroke="#dfe7df"/><text x="873" y="454" font-family="Arial,sans-serif" font-size="20" fill="#283d39" font-weight="600">Tareas</text><text x="873" y="506" font-family="Arial,sans-serif" font-size="17" fill="#283d39" font-weight="400">Hacer ejercicio</text><rect x="873" y="528" width="236" height="28" rx="5" fill="#f6f8f5" stroke="none"/><text x="884" y="547" font-family="Arial,sans-serif" font-size="11" fill="#74897b" font-weight="400">Salud / Ejercicio</text><text x="873" y="583" font-family="Arial,sans-serif" font-size="12" fill="#2f7454" font-weight="400">Ver tareas →</text><rect x="280" y="628" width="548" height="190" rx="12" fill="#ffffff" stroke="#dfe7df"/><text x="305" y="667" font-family="Arial,sans-serif" font-size="20" fill="#283d39" font-weight="600">Compras</text><text x="305" y="719" font-family="Arial,sans-serif" font-size="17" fill="#283d39" font-weight="400">Comprar café</text><rect x="305" y="741" width="236" height="28" rx="5" fill="#f6f8f5" stroke="none"/><text x="316" y="760" font-family="Arial,sans-serif" font-size="11" fill="#74897b" font-weight="400">Hogar / Compras</text><text x="305" y="796" font-family="Arial,sans-serif" font-size="12" fill="#2f7454" font-weight="400">Ver compras →</text><rect x="848" y="628" width="548" height="190" rx="12" fill="#ffffff" stroke="#dfe7df"/><text x="873" y="667" font-family="Arial,sans-serif" font-size="20" fill="#283d39" font-weight="600">Notas</text><text x="873" y="719" font-family="Arial,sans-serif" font-size="17" fill="#283d39" font-weight="400">Idea para mi proyecto</text><rect x="873" y="741" width="236" height="28" rx="5" fill="#f6f8f5" stroke="none"/><text x="884" y="760" font-family="Arial,sans-serif" font-size="11" fill="#74897b" font-weight="400">Trabajo / Ideas</text><text x="873" y="796" font-family="Arial,sans-serif" font-size="12" fill="#2f7454" font-weight="400">Ver notas →</text><text x="280" y="895" font-family="Arial,sans-serif" font-size="12" fill="#74897b" font-weight="400">Representación del flujo del producto. No es una captura de una cuenta real.</text></svg>